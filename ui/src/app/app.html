<div>
  <input 
    type="file" 
    accept="image/*" 
    id="fileInput" 
    (change)="onFileSelected($event)">
    
  <button (click)="clear()">Clear</button>

  <google-map
  *ngIf="googleMapsLoaded"
  [height]="'100vh'"
  [width]="'100%'"
  [center]="center"
  [zoom]="zoom">
</google-map>

</div>
