<div #mapContainer style="height: 100vh; width: 100vw; position: relative;">
  <input 
    type="file" 
    accept="image/*" 
    id="fileInput" 
    (change)="onFileSelected($event)" 
  >

  <google-map height="100%" width="100%" [center]="center" [zoom]="zoom">
    <map-marker *ngFor="let coord of coords" [position]="coord"></map-marker>
  </google-map>
</div>
